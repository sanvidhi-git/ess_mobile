[project]
name = "ess_mobile"
authors = [
    { name = "Sanvidhi Tech Pvt. Ltd.", email = "vijayshastri11@gmail.com" }
]
description = "Backend for the Employee Self Service Android app: selfie + geo attendance, travel tracking, leave, payslips, expenses"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
